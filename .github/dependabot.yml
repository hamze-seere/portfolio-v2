version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Packages that must move together arrive as one pull request.
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
